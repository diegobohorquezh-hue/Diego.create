name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/modest-gates-gavgvz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar el sitio (v1 en la raíz, v2 en /v2/)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/
          rsync -a --exclude '.taste-skill' --exclude 'shots' --exclude '.gitignore' v2/ _site/v2/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
